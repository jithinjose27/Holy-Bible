<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>The Holy Bible — EasyEnglish Reader & Chapter Q&A Study</title>
    <meta name="description" content="Read the Holy Bible in EasyEnglish with side-by-side King James Version (KJV) and 500 chapter-wise review questions. 100% offline capable." />
    
    <!-- PWA & Theme Color -->
    <meta name="theme-color" content="#78350f" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Favicons & Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    
    <!-- Apple iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Holy Bible" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- Microsoft Windows Tiles -->
    <meta name="msapplication-TileColor" content="#78350f" />
    <meta name="msapplication-TileImage" content="/icons/icon-192.png" />

    <!-- Google Fonts for Bible Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Synchronous Theme Bootstrapper to prevent FOUT (Flash of Unstyled Theme) -->
    <script>
      (function() {
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const theme = urlParams.get('theme') || localStorage.getItem('holy_bible_theme') || 'paper';
          const isDark = theme === 'dark' || theme === 'midnight';
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          const bgMap = { paper: '#fbf9f5', sepia: '#f4ecd8', dark: '#1c1917', midnight: '#0b0f19' };
          const colorMap = { paper: '#1c1917', sepia: '#291e10', dark: '#f5f5f4', midnight: '#f8fafc' };
          const bg = bgMap[theme] || '#fbf9f5';
          const color = colorMap[theme] || '#1c1917';
          document.documentElement.style.backgroundColor = bg;
          document.documentElement.style.color = color;
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-amber-100 selection:text-amber-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
